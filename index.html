<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hex Settlers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hex Settlers">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
  <section id="menu" class="screen"></section>

  <section id="game" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" data-act="menu" aria-label="Menu">☰</button>
      <div id="players"></div>
    </header>
    <div id="status">
      <div class="status-text"><div id="msg"></div><div id="log"></div></div>
      <div id="dice"></div>
      <div id="timer"></div>
    </div>
    <div class="board-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Game board"></svg>
      <div id="dicepop" class="dicepop"></div>
      <div id="banner" class="banner"></div>
      <div id="note" class="note"></div>
      <div class="board-tools">
        <button class="icon-btn" id="undo" data-act="undo" hidden>↶ Undo</button>
        <button class="icon-btn" id="sound" data-act="sound" aria-label="Sound on or off">🔊</button>
        <button class="icon-btn" data-act="fit" aria-label="Fit board">⤢</button>
      </div>
      <div id="sheet" class="sheet"></div>
    </div>
    <footer class="dock">
      <div id="warn" class="warn" hidden></div>
      <div id="hand"></div>
      <div id="actions"></div>
    </footer>
    <div id="cover" class="cover"></div>
    <div id="toast"></div>
  </section>

  <script type="module" src="ui/main.js"></script>
</body>
</html>
