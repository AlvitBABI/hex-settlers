<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hex Settlers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hex Settlers">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #1e3a5f; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
    h1 { font-size: 2rem; }
    p { opacity: .7; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>It works</h1>
    <p id="status">Checking offline mode…</p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => navigator.serviceWorker.ready)
        .then(() => { document.getElementById('status').textContent = 'Ready for offline use ✓'; })
        .catch(() => { document.getElementById('status').textContent = 'Offline mode failed to start'; });
    } else {
      document.getElementById('status').textContent = 'Offline mode not supported here';
    }
  </script>
</body>
</html>
